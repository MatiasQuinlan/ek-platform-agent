name: Build agent

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --all-groups
      - run: uv run pyinstaller --name EKPlatformAgent --windowed --noconfirm --hidden-import=tkinter --hidden-import=_tkinter src/ek_agent/__main__.py
      - run: hdiutil create -volname "EK Platform Agent" -srcfolder dist/EKPlatformAgent.app -ov -format UDZO dist/EKPlatformAgent-macOS.dmg
      - uses: actions/upload-artifact@v4
        with:
          name: ek-platform-agent-macos
          path: dist/EKPlatformAgent-macOS.dmg

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --all-groups
      - run: uv run pyinstaller --name EKPlatformAgent --windowed --onefile --hidden-import=tkinter --hidden-import=_tkinter src/ek_agent/__main__.py
      - uses: actions/upload-artifact@v4
        with:
          name: ek-platform-agent-windows
          path: dist/EKPlatformAgent.exe
